name: Generate endovascular explainer video
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_endovascular_video.py'
      - '.github/workflows/generate-endovascular-video.yml'
permissions:
  contents: write
jobs:
  build-video:
    if: ${{ !contains(github.event.head_commit.message, 'Add generated endovascular explainer video') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak python3-pil
      - name: Build the German explainer
        run: python3 scripts/generate_endovascular_video.py
      - name: Commit generated video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/endovascular-explainer-de.mp4
          if git diff --cached --quiet; then
            echo "Video is already up to date."
          else
            git commit -m "Add generated endovascular explainer video"
            git push
          fi
